name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Upload site
        # no --delete: uploads/ and server-written data must survive
        run: |
          rsync -rltvz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='uploads' --exclude='data' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:domains/nbarmej.com/public_html/
