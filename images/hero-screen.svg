<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="لوحة تحكم نبرمج">
  <style>
@media (prefers-reduced-motion:no-preference){
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.6s cubic-bezier(.3,.7,.2,1) infinite}
.b2{animation-delay:.12s}.b3{animation-delay:.24s}.b4{animation-delay:.36s}.b5{animation-delay:.48s}.b6{animation-delay:.6s}.b7{animation-delay:.72s}
@keyframes grow{0%{transform:scaleY(.05)}30%,80%{transform:scaleY(1)}100%{transform:scaleY(.05)}}
.sweep{animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(800px)}}
.line{animation:pulse 1.8s ease-in-out infinite}.l2{animation-delay:.3s}.l3{animation-delay:.6s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(30px,760px) rotate(4deg)}50%{transform:translate(30px,742px) rotate(2deg)}}
.sun{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ok{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.nav{animation:nav 4s steps(1) infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}
@keyframes nav{0%{fill:#FF5A1F}25%,100%{fill:#2A2926}}
.dot{animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.btn{transform-box:fill-box;transform-origin:left center;animation:btn 3.2s ease-in-out infinite}
@keyframes btn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.25)}}
}</style>
